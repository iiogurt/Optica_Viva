name: Bug report
description: Something renders wrongly, crashes, or behaves unexpectedly
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page / link
      description: Use the "Copy link" button so the exact settings are included.
      placeholder: https://iiogurt.github.io/Optica_Viva/#/psf?preset=jwst
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: input
    id: browser
    attributes:
      label: Browser, OS and device
      placeholder: Safari 26 on iPhone 15 / Chromium 140 on Raspberry Pi 4
  - type: textarea
    id: console
    attributes:
      label: Console output or screenshot (optional)
